<!doctype html>
<html lang="pt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AuditFlow AI{% endblock %}</title>
</head>
<body>
    <header>
        <strong>AuditFlow AI</strong>
        {% if user.is_authenticated %}
            <span>{{ user.email }}</span>
        {% endif %}
        {% if organization %}
            <nav aria-label="Navegação da organização">
                <a href="{% url 'imports:upload' organization.id %}">Carregar faturas</a>
                <a href="{% url 'alerts:list' organization.id %}">Alertas</a>
            </nav>
        {% endif %}
    </header>
    <main>
        {% for message in messages %}
            <p role="status">{{ message }}</p>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
